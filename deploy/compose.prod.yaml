name: form-automation-backend

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      EXCEL_DIR: /app/excel_files
      SCREENSHOTS_DIR: /app/screenshots
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-9090}:8000"
    volumes:
      - excel_files:/app/excel_files
      - screenshots:/app/screenshots
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  excel_files:
  screenshots:
